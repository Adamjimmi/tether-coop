function update(rdt){
if(G.hs>0){G.hs-=rdt;return}
if(G.down<0&&state=='play')G.slow+=(1-G.slow)*Math.min(1,rdt*3);
const dt=rdt*G.slow;G.t+=dt;
if(G.cd>0&&state=='play'){G.cd-=rdt;const n=Math.max(0,Math.ceil(G.cd));if(n!==G.cdN){G.cdN=n;fx('cd',n);if(n==0){G.cd=0;nextWave()}}}
G.P.forEach((p,i)=>{p.dcd=Math.max(0,p.dcd-rdt);p.inv=Math.max(0,p.inv-rdt);if(p.dead||p.down)return;
let[x,y]=state=='play'?input(i):[0,0];if(x||y){const m=Math.hypot(x,y);p.fx=x/m;p.fy=y/m}
if(p.dash>0){p.dash-=rdt;p.vx=p.dvx*S.sp*3.4;p.vy=p.dvy*S.sp*3.4}
else{const k=Math.min(1,rdt*14);p.vx+=(x*S.sp-p.vx)*k;p.vy+=(y*S.sp-p.vy)*k}
p.x=clamp(p.x+p.vx*rdt,10,W-10);p.y=clamp(p.y+p.vy*rdt,10,H-10)});
const a=G.P[0],b=G.P[1];let d=Math.hypot(b.x-a.x,b.y-a.y);
if(d>S.L&&!a.dead&&!b.dead){const k=(d-S.L)/d,ex=(b.x-a.x)*k,ey=(b.y-a.y)*k,wa=a.down?0:b.down?1:.5;a.x+=ex*wa;a.y+=ey*wa;b.x-=ex*(1-wa);b.y-=ey*(1-wa);d=S.L}
const taut=Math.min(1,d/S.L);G.taut=taut;const on=!a.dead&&!b.dead&&!a.down&&!b.down;G.on=on;
if(G.down>=0&&state=='play'){const p=G.P[G.down],o=G.P[1-G.down];G.downT-=rdt;
if(Math.hypot(p.x-o.x,p.y-o.y)<28){p.down=0;p.inv=2;G.down=-1;knock(p.x,p.y,130,380);fx('revive',Math.round(p.x),Math.round(p.y))}
else if(G.downT<=0){const k=G.down;G.down=-1;gameOver(k)}}
const mv=p=>Math.hypot(p.vx,p.vy)>30;G.sci=S.sc&&on&&mv(a)&&mv(b)&&(a.vx*b.vx+a.vy*b.vy)<0;
const dps=S.dps*(.6+.7*taut)*(G.sci?1+S.sc:1);
if(state=='play'&&G.cd<=0){G.spawnT-=dt;if(G.spawnLeft>0&&G.spawnT<=0){const q=spot();G.warn.push({x:q[0],y:q[1],t:.8,ty:pickType()});G.spawnLeft--;G.spawnT=Math.max(.3,1.1-G.wave*.06)*(G.boss?2.5:1)}
G.diaT-=dt;if(G.diaT<=0){G.diaT=18+Math.random()*22;const q=spot();G.dias.push({x:q[0],y:q[1],t:9})}}
for(let i=G.warn.length-1;i>=0;i--){const w=G.warn[i];w.t-=dt;if(w.t<=0){G.warn.splice(i,1);mkE(w.ty,w.x,w.y)}}
const alive=G.P.filter(p=>!p.dead);
for(const e of G.E){if(!alive.length)break;let tg=alive[0];if(alive[1]&&Math.hypot(alive[1].x-e.x,alive[1].y-e.y)<Math.hypot(tg.x-e.x,tg.y-e.y))tg=alive[1];
let sp=e.sp*(e.sl>0?.5:1);e.sl-=dt;e.fl-=dt;if(e.tel>0||e.chg>0)sp=0;
const dx=tg.x-e.x,dy=tg.y-e.y,m=Math.hypot(dx,dy)||1;if(e.ty=='g'&&m<140)sp*=-.4;
let mx=dx/m,my=dy/m;if(e.ty=='r'){const s=Math.sin(G.t*6+e.ph)*.7;mx+=-dy/m*s;my+=dx/m*s}
e.x+=mx*sp*dt+e.kx*dt;e.y+=my*sp*dt+e.ky*dt;const f=Math.pow(.02,dt);e.kx*=f;e.ky*=f;e.x=clamp(e.x,e.r,W-e.r);e.y=clamp(e.y,e.r,H-e.r);e.ex=dx/m;e.ey=dy/m;

showOv(`<p class="h">Уровень ${G.lvl}</p><p class="note">${who<0?'Выберите улучшение вдвоём':can?'Твой выбор. Партнёр ждёт':'Выбирает партнёр…'}</p>`);
ids.forEach(id=>{const u=UPS.find(x=>x.id==id);if(!u)return;const lv=G.lv[u.id]||0,rc=RAR[u.r],bt=document.createElement('button');bt.className='btn card';bt.style.borderColor=rc[1];if(!can)bt.disabled=true;
bt.innerHTML=tr(`<span class="ic" style="background:${rc[1]}22;color:${rc[1]}">${u.ic}</span><span><b>${u.n}${lv?' · ур. '+(lv+1):''}</b><small>${u.d}</small><small style="color:${rc[1]}">${rc[0]}</small></span>`);
bt.onclick=()=>{if(!can||performance.now()-t0<350)return;if(mode=='guest'){send({t:'choose',id});play('pick');ov.querySelectorAll('.card').forEach(c=>c.disabled=true);return}applyPick(id)};ov.appendChild(bt)})}
function applyPick(id){const u=UPS.find(x=>x.id==id);if(!u||state!='pick')return;u.f();G.lv[id]=(G.lv[id]||0)+1;play('pick');G.P.forEach(p=>p.inv=Math.max(p.inv,1));
if(G.pend>0&&G.down<0)openPick();else{state='play';hideOv();if(mode=='host')send({t:'resume'})}}
function finishRun(){state='over';const st={score:Math.round(G.score),wave:G.wave,kills:G.kills,lvl:G.lvl};if(mode=='host')send({t:'over',st});showOver(st)}
function showOver(st){state='over';const nb=st.score>SAVE.best;if(nb){SAVE.best=st.score;save()}ov.style.background='rgba(13,12,19,.86)';
const rd=G?G.runDia||0:0;
showOv(`<p class="h">Забег окончен</p><p class="note">Вся прокачка сгорела. Алмазы остаются.</p>
<div class="stats"><div><b>${st.score}</b><span>очки</span></div><div><b>${st.wave}</b><span>волна</span></div><div><b>${st.kills}</b><span>убито</span></div><div><b style="color:#9FE1F5">+${rd} ◆</b><span>алмазов</span></div></div>
<p class="note" style="color:${nb?'#FAC775':'#9a98b3'}">${nb?'Новый рекорд!':'Рекорд: '+SAVE.best}</p>
${mode=='guest'?'<p class="st">Ждём, пока хост начнёт новый забег…</p>':'<button class="btn pri" id="oAgain">Новый забег</button>'}
<button class="btn sm" id="oMenu">В меню</button>`);
on('oAgain',()=>{mode=='host'?startOnline():newGame()});on('oMenu',showMenu)}

/* ================= сеть ================= */
let peer=null,conn=null,netLag=0,lastIn=[9,9],snapT=0,inT=0;
const PFX='svyazka-coop-v1-';
function _unusedGenCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.random()*A.length|0];return s}
function peerOpts(){const h=QS.get('peerhost');if(h)return{host:h,port:+QS.get('peerport')||9000,path:QS.get('peerpath')||'/',secure:QS.get('peersecure')=='1',debug:0};
return{debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}}}
/* тестовая сеть через BroadcastChannel: ?mocknet=1, две вкладки одного браузера */
class MockConn{constructor(ch,self,other){this.ch=ch;this.self=self;this.other=other;this.open=false;this.h={}}on(e,f){this.h[e]=f;return this}
emit(e,a){if(this.h[e])this.h[e](a)}send(m){this.ch.postMessage({k:'data',to:this.other,from:this.self,m:JSON.parse(JSON.stringify(m))})}close(){if(!this.open)return;this.open=false;this.ch.postMessage({k:'close',to:this.other,from:this.self});this.emit('close')}}
class MockPeer{constructor(id){this.id=id||'g'+Math.random().toString(36).slice(2,8);this.h={};this.ch=new BroadcastChannel('svyazka-mock');this.conns={};this.dead=false;const nonce='n'+Math.random();let taken=false;
this.ch.onmessage=ev=>{const d=ev.data;if(this.dead)return;
if(d.k=='claim'){if(d.id===this.id&&this.ready)this.ch.postMessage({k:'taken',to:d.nonce});return}
if(d.k=='taken'&&d.to===nonce){taken=true;return}
if(d.to!==this.id)return;
if(d.k=='conn'){const c=new MockConn(this.ch,this.id,d.from);c.metadata=d.meta;this.conns[d.from]=c;this.emit('connection',c);setTimeout(()=>{c.open=true;this.ch.postMessage({k:'ok',to:d.from,from:this.id});c.emit('open')},30)}
else if(d.k=='ok'){const c=this.conns[d.from];if(c){c.open=true;c.emit('open')}}
else if(d.k=='data'){const c=this.conns[d.from];if(c&&c.open)c.emit('data',d.m)}
else if(d.k=='close'){const c=this.conns[d.from];if(c&&c.open){c.open=false;c.emit('close')}}};
if(id)this.ch.postMessage({k:'claim',id,nonce});
setTimeout(()=>{if(this.dead)return;if(taken){this.emit('error',{type:'unavailable-id'});return}this.ready=true;this.emit('open',this.id)},150)}
on(e,f){this.h[e]=f;return this}emit(e,a){if(this.h[e])this.h[e](a)}
connect(id,o){const c=new MockConn(this.ch,this.id,id);c.metadata=o&&o.metadata;this.conns[id]=c;this.ch.postMessage({k:'conn',to:id,from:this.id,meta:c.metadata});
setTimeout(()=>{if(!c.open&&!this.dead){this.emit('error',{type:'peer-unavailable',message:'Could not connect to peer '+id});c.emit('close')}},400);return c}
destroy(){Object.values(this.conns).forEach(c=>c.close());this.dead=true;this.ch.close()}reconnect(){}}
function mkPeer(id){if(QS.has('mocknet'))return new MockPeer(id);return id?new Peer(id,peerOpts()):new Peer(peerOpts())}
function send(m){try{if(conn&&conn.open)conn.send(m)}catch(e){}}
function netClose(){const c=conn,p=peer;conn=null;peer=null;try{c&&c.close()}catch(e){}try{p&&p.destroy()}catch(e){}RIN=[0,0]}
const SLOTS=16,slotId=i=>PFX+'srv'+i;let ROOM='',rooms={},scanPeer=null,scanPending=new Set();
function stopScan(){const p=scanPeer;scanPeer=null;scanPending=new Set();try{p&&p.destroy()}catch(e){}}
function scan(){stopScan();rooms={};const p=mkPeer();scanPeer=p;renderRooms();
const ids=[];for(let i=0;i<SLOTS;i++)ids.push(slotId(i));ids.forEach(id=>scanPending.add(id));renderRooms();
const done=id=>{if(scanPeer!==p)return;if(scanPending.delete(id))renderRooms()};
p.on('open',()=>{if(scanPeer!==p)return;ids.forEach((id,k)=>setTimeout(()=>{if(scanPeer!==p)return;let c;try{c=p.connect(id,{metadata:{probe:1},serialization:'json',reliable:true})}catch(e){done(id);return}
c.on('data',m=>{if(m&&m.t=='info'&&scanPeer===p){rooms[id]={id,name:cleanName(m.name),pl:clamp(+m.pl||1,1,2),v:m.v};done(id);try{c.close()}catch(e){}}});
c.on('close',()=>done(id));c.on('error',()=>done(id));setTimeout(()=>done(id),8000)},k*60))});
p.on('error',e=>{if(scanPeer!==p)return;if(e.type=='peer-unavailable'){const m=/(svyazka-[\w-]+)/.exec(e.message||'');if(m)done(m[1])}else{ids.forEach(done);toast('Не удалось получить список серверов')}})}
function renderRooms(){const el=$('slist');if(!el)return;const rs=Object.values(rooms).sort((a,b)=>a.pl-b.pl||a.name.localeCompare(b.name));
let h=rs.map(r=>{const free=r.pl<2&&r.v===1;return `<div class="si"><span class="n" data-rid="${esc(r.id)}"></span><span class="pl">${r.v===1?r.pl+'/2':'другая версия'}</span><button class="btn ${free?'pri':''}" data-id="${esc(r.id)}" ${free?'':'disabled'}>${free?'Войти':'Полный'}</button></div>`}).join('');
if(scanPending.size)h+='<p class="st">Ищем серверы…</p>';else if(!rs.length)h+='<p class="st">Серверов пока нет. Создай свой!</p>';
el.innerHTML=tr(h);el.querySelectorAll('span[data-rid]').forEach(x=>{const r=rooms[x.dataset.rid];x.textContent=r?(r.name||tr('Без названия')):''});el.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{initAudio();play('ui');const r=rooms[b.dataset.id];if(r)joinRoom(r.id,r.name)})}
function hostRoom(name,slot){stopScan();netClose();mode='host';me=0;state='lobby';ROOM=name;showLobby(name);lobbyStatus('Запускаем сервер…');
try{peer=mkPeer(slotId(slot))}catch(e){lobbyStatus('Не удалось запустить сеть');return}const my=peer;
peer.on('open',()=>{if(peer===my)lobbyStatus('Сервер в списке. Ждём второго игрока')});
peer.on('connection',c=>{if(peer!==my)return;const meta=c.metadata||{};
if(meta.probe){c.on('open',()=>{try{c.send({t:'info',name:ROOM,pl:conn&&conn.open?2:1,v:1})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},1500)});return}
if((conn&&conn.open)||state!='lobby'){c.on('open',()=>{try{c.send({t:'full'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400)});return}
conn=c;wire(c)});
peer.on('error',e=>{if(peer!==my)return;if(e.type=='unavailable-id'){if(slot+1<SLOTS)hostRoom(name,slot+1);else lobbyStatus('Все места заняты. Попробуй позже')}else if(e.type!='peer-unavailable')lobbyStatus('Ошибка сети: '+(e.type||'неизвестно'))});
peer.on('disconnected',()=>{try{if(peer===my)my.reconnect()}catch(e){}})}
function joinRoom(id,name){stopScan();netClose();mode='guest';me=1;state='lobby';showLobby(name);lobbyStatus('Подключаемся…');
try{peer=mkPeer()}catch(e){lobbyStatus('Не удалось запустить сеть');return}const my=peer;
peer.on('open',()=>{if(peer!==my)return;const c=peer.connect(id,{reliable:true,serialization:'json',metadata:{join:1}});conn=c;wire(c);setTimeout(()=>{if(conn===c&&!c.open&&state=='lobby')lobbyStatus('Не получается подключиться. Обнови список и попробуй ещё раз')},10000)});
peer.on('error',e=>{if(peer!==my)return;lobbyStatus(e.type=='peer-unavailable'?'Сервер закрылся. Вернись к списку':'Ошибка сети: '+(e.type||'неизвестно'))})}
function wire(c){c.on('open',()=>{if(conn!==c)return;send({t:'hello',skin:SAVE.skin[0],v:1});
if(mode=='host'){lobbyStatus('Партнёр подключился!');const b=$('lgo');if(b)b.style.display='';play('clear')}else{lobbyStatus('Подключено. Ждём, пока хост начнёт');play('clear')}});
c.on('data',m=>{if(conn===c)onMsg(m)});c.on('close',()=>{if(conn===c)onDisc()});c.on('error',()=>{})}
function onDisc(){showMenu();toast('Партнёр отключился')}
function startOnline(){if(!conn||!conn.open){toast('Партнёр ещё не подключился');return}const sk=[SAVE.skin[0],SKINS.some(s=>s.id==guestSkin)?guestSkin:'none'];newGame(sk);NETEV=[];send({t:'start',skins:sk})}
function guestStart(skins){S=defS();G=makeG(skins);G.cd=99;state='play';hideOv();mOn=true;netLag=0}
function onMsg(m){if(!m||typeof m.t!='string')return;
switch(m.t){
case 'hello':if(mode=='host')guestSkin=String(m.skin||'none');break;
case 'i':if(mode=='host')RIN=[clamp(+m.x||0,-1,1),clamp(+m.y||0,-1,1)];break;
case 'd':if(mode=='host')dash(1);break;
case 'choose':if(mode=='host'&&state=='pick'&&G&&G.pickWho===1)applyPick(String(m.id));break;
case 'start':if(mode=='guest'&&Array.isArray(m.skins))guestStart(m.skins.map(String));break;
case 's':if(mode=='guest'&&G)applySnap(m);break;
case 'pick':if(mode=='guest'&&G&&Array.isArray(m.ch)){state='pick';G.lv=m.lv||{};G.lvl=m.lvl;showPick(m.ch,m.who)}break;
case 'resume':if(mode=='guest'&&G){state='play';if(!ovMenu)hideOv()}break;
case 'over':if(mode=='guest'&&G&&m.st)showOver(m.st);break;
case 'full':if(mode=='guest'&&state=='lobby'){showOnline();toast('Сервер уже заполнен')}break}}
const r1=v=>Math.round(v*10)/10;
function snap(){return{t:'s',
P:G.P.map(p=>[r1(p.x),r1(p.y),r1(p.fx),r1(p.fy),p.dash>0?1:0,r1(p.dcd),r1(p.inv),p.breath,p.down,p.dead]),
E:G.E.map(e=>[e.id,TY.indexOf(e.ty),r1(e.x),r1(e.y),Math.round(Math.max(0,e.hp)/e.mh*100),e.fl>0?1:0,e.sl>0?1:0,r1(e.ex),r1(e.ey),e.tel>0?1:0,r1(e.cdx||0),r1(e.cdy||0),r1(e.rot||0),e.bu>0?1:0,e.chg>0?1:0]),
B:G.B.map(q=>[r1(q.x),r1(q.y),Math.round(q.vx),Math.round(q.vy)]),F:G.F.map(q=>[r1(q.x),r1(q.y),Math.round(q.vx),Math.round(q.vy)]),
gm:G.gems.map(g=>[Math.round(g.x),Math.round(g.y),g.v]),dm:G.dias.map(d=>[Math.round(d.x),Math.round(d.y),r1(d.t)]),wn:G.warn.map(w=>[Math.round(w.x),Math.round(w.y),r1(w.t),TY.indexOf(w.ty)]),
S:[S.sh,r1(S.dcd),S.w,S.brn,S.sc],g:[G.wave,Math.round(G.score),G.combo,r1(G.comboT),G.lvl,G.xp,G.xpN,G.boss?Math.round(Math.max(0,G.boss.hp)/G.boss.mh*1000):-1,G.down,r1(G.downT),r1(G.taut),G.on?1:0,G.sci?1:0,r1(G.t),r1(G.cd)],
ev:NETEV.splice(0,200)}}
function applySnap(s){netLag=0;
(s.P||[]).forEach((a,i)=>{const p=G.P[i];if(!p)return;p.gx=a[0];p.gy=a[1];p.fx=a[2];p.fy=a[3];p.dash=a[4]?.1:0;p.dcd=a[5];p.inv=a[6];p.breath=a[7];p.down=a[8];p.dead=a[9];if(G.first){p.x=p.gx;p.y=p.gy}});G.first=0;
const old=new Map(G.E.map(e=>[e.id,e]));G.E=(s.E||[]).map(a=>{const ty=TY[a[1]]||'c';let e=old.get(a[0]);if(!e)e={id:a[0],ty,x:a[2],y:a[3],r:ET[ty][0],col:ET[ty][3],ph:Math.random()*6,mh:100};
Object.assign(e,{gx:a[2],gy:a[3],hp:a[4],fl:a[5]?.05:0,sl:a[6],ex:a[7],ey:a[8],tel:a[9],cdx:a[10],cdy:a[11],rot:a[12],bu:a[13],chg:a[14]});return e});
G.B=(s.B||[]).map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3]}));G.F=(s.F||[]).map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3]}));
G.gems=(s.gm||[]).map(a=>({x:a[0],y:a[1],v:a[2]}));G.dias=(s.dm||[]).map(a=>({x:a[0],y:a[1],t:a[2]}));G.warn=(s.wn||[]).map(a=>({x:a[0],y:a[1],t:a[2],ty:TY[a[3]]||'c'}));
if(s.S)[S.sh,S.dcd,S.w,S.brn,S.sc]=s.S;
const g=s.g||[];[G.wave,G.score,G.combo,G.comboT,G.lvl,G.xp,G.xpN]=g;G.boss=g[7]>=0?{hp:g[7],mh:1000}:null;G.down=g[8];G.downT=g[9];G.taut=g[10];G.on=g[11];G.sci=g[12];G.t=g[13];G.cd=g[14];
(s.ev||[]).forEach(ev=>{if(Array.isArray(ev)&&FX[ev[0]])try{FX[ev[0]](...ev.slice(1))}catch(e){}})}
function guestStep(dt){netLag+=dt;G.t+=dt;const k=Math.min(1,dt*18);
G.P.forEach(p=>{if(p.gx==null)return;p.x+=(p.gx-p.x)*k;p.y+=(p.gy-p.y)*k});
G.E.forEach(e=>{if(e.gx==null)return;e.x+=(e.gx-e.x)*k;e.y+=(e.gy-e.y)*k;if(e.fl>0)e.fl-=dt});
G.B.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt});G.F.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt});G.warn.forEach(w=>w.t-=dt);G.dias.forEach(d=>d.t-=dt)}

/* ================= кнопки сверху ================= */
on('bSnd',()=>{muted=!muted;applyVol();$('sndw').style.display=muted?'none':''});
on('bFs',()=>{try{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}}catch(e){toast('Полный экран недоступен')}});
on('bMenu',()=>{if(state=='menu'||state=='lobby')return;if(state=='over'){showMenu();return}menuBtn()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode=='local'&&state=='play')menuBtn()});
document.addEventListener('fullscreenchange',()=>setTimeout(layout,100));

/* ================= цикл ================= */
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;
try{if(G){if(mode!='guest'&&(state=='play'||state=='dying'))update(dt);
if(mode=='guest')guestStep(dt);
if(state=='play'||state=='dying'||mode=='guest')localFx(dt);
G.shake=Math.max(0,G.shake-dt*35)}
if(mode=='host'&&conn&&conn.open&&G){snapT-=dt;if(snapT<=0){snapT=.05;send(snap())}}
if(mode=='guest'&&conn&&conn.open&&G&&state=='play'){inT-=dt;if(inT<=0){inT=.033;const[x,y]=input(0);const rx=Math.round(x*100)/100,ry=Math.round(y*100)/100;if(rx!==lastIn[0]||ry!==lastIn[1]||Math.random()<.05){send({t:'i',x:rx,y:ry});lastIn=[rx,ry]}}}
draw();if(TOUCH)drawPad();
if(AC&&lp)lp.frequency.setTargetAtTime((state=='play'||state=='dying')&&!ovMenu?9000:700,AC.currentTime,.15)}catch(err){console.error(err)}
requestAnimationFrame(loop)}
showMenu();requestAnimationFrame(loop);
